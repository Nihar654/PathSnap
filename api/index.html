<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PathSnap Prediction UI</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem;}
        textarea {width: 100%; height: 80px;}
        button {margin-top: 1rem; padding: 0.5rem 1rem;}
        #result {margin-top: 1rem; font-weight: bold;}
    </style>
</head>
<body>
    <h1>PathSnap Model Prediction</h1>
    <p>Enter feature values as a comma‑separated list (same order as training data):</p>
    <textarea id="featuresInput" placeholder="0.1, 2.3, 4.5, ..."></textarea><br>
    <button onclick="callPredict()">Predict</button>
    <div id="result"></div>

    <script>
        async function callPredict() {
            const raw = document.getElementById('featuresInput').value.trim();
            if (!raw) { alert('Please enter feature values'); return; }

            const arr = raw.split(',')
                .map(v => parseFloat(v.trim()))
                .filter(v => !isNaN(v));

            const resultDiv = document.getElementById('result');

            try {
                const res = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({features: arr})
                });
                const data = await res.json();
                if (res.ok) {
                    resultDiv.textContent = "Prediction: " + data.prediction;
                } else {
                    resultDiv.textContent = "Error: " + (data.detail || data.message);
                }
            } catch (e) {
                resultDiv.textContent = "Network error: " + e.message;
            }
        }
    </script>
</body>
</html>
